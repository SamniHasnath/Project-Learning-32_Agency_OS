name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agency_os
          POSTGRES_PASSWORD: agency_os
          POSTGRES_DB: agency_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agency_os" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agency_os:agency_os@localhost:5432/agency_os?schema=public
      TEST_DATABASE_URL: postgresql://agency_os:agency_os@localhost:5432/agency_os_test?schema=public
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e
      - run: npx nest build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npm run build
