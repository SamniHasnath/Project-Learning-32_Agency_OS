# Full Agency OS stack: PostgreSQL + API + web app.
#
#   cp .env.example .env        # then set JWT_SECRET and POSTGRES_PASSWORD
#   docker compose up -d --build
#   docker compose exec api npm run db:seed    # optional demo data
#
# Web: http://localhost:3000   API: http://localhost:3001/api   Docs: http://localhost:3001/api/docs
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agency_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agency_os
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency_os -d agency_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agency_os:${POSTGRES_PASSWORD}@db:5432/agency_os?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (48+ random characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${WEB_ORIGIN:-http://localhost:3000}
      PORT: 3001
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db-data:
